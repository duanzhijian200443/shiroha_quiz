name: shiroha_quiz
description: A minimal, smooth, offline-first quiz app for CS 408 exam prep.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.7+1
  flutter_math_fork: ^0.7.4
  flutter_secure_storage: ^10.3.1
  flutter_heatmap_calendar: ^1.0.5
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.2
  shared_preferences: ^2.2.3
  syncfusion_flutter_pdf: ^33.2.7
  flutter_markdown_latex: ^0.3.4
  markdown: ^7.3.1
  docx_to_text: ^1.0.1
  wakelock_plus: ^1.5.2
  image: ^4.3.0
  gpt_markdown: ^1.1.7
  flutter_tex: ^5.2.6
  archive: ^3.6.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  pdfx: ^2.9.2
  fl_chart: ^1.2.0
  mcp_dart: 2.4.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/流萤.png

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3
