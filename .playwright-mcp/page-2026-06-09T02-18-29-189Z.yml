              - heading [level=3] [ref=e234]: 2. Contextual Optical Compression
              - generic [ref=e236]:
                - text: Instead of detecting and classifying individual glyphs sequentially, models compress the visual information directly.
                - generic [ref=e238]:
                  - link [ref=e239] [cursor=pointer]:
                    - /url: https://huggingface.co/blog/prithivMLmods/multimodal-ocr-vlms
                  - button [ref=e240] [cursor=pointer]:
