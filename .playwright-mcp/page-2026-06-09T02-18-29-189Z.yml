              - heading [level=3] [ref=e206]: 1. Coarse-to-Fine Cascaded Layout Processing
              - generic [ref=e208]:
                - text: "Standard VLMs suffer from a quadratic increase in visual tokens when fed full pages at high resolutions. State-of-the-art models mitigate this via decoupled cascades:"
                - generic [ref=e210]:
                  - link [ref=e211] [cursor=pointer]:
                    - /url: https://openaccess.thecvf.com/content/CVPR2026/papers/Cui_Boosting_Document_Parsing_Efficiency_and_Performance_with_Coarse-to-Fine_Visual_Processing_CVPR_2026_paper.pdf
