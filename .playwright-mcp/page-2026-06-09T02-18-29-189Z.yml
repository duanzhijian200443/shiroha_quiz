              - list [ref=e218]:
                - listitem [ref=e219]:
                  - generic [ref=e220]:
                    - strong [ref=e221]: "Valid Region Focus:"
                    - text: A lightweight module initially runs a fast, coarse layout analysis (e.g., PP-DocLayout) to identify bounding boxes for text blocks, formulas, and charts.
                - listitem [ref=e222]:
                  - generic [ref=e223]:
                    - strong [ref=e224]: "Selective Zoom:"
                    - text: Instead of processing an entire document page's pixels, the VLM extracts and processes only these informative, high-resolution regions, drastically cutting down the token budget.
                  - generic [ref=e226]:
                    - link [ref=e227] [cursor=pointer]:
                      - /url: https://openaccess.thecvf.com/content/CVPR2026/papers/Cui_Boosting_Document_Parsing_Efficiency_and_Performance_with_Coarse-to-Fine_Visual_Processing_CVPR_2026_paper.pdf
