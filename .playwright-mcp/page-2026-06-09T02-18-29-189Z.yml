              - list [ref=e245]:
                - listitem [ref=e246]:
                  - generic [ref=e247]:
                    - strong [ref=e248]: "Encoder-Based Compression:"
                    - text: Encoders like DeepEncoder process complex, high-resolution document images and compress the pixel space into a significantly smaller sequence of visual tokens.
                - listitem [ref=e249]:
