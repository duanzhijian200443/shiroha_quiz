              - heading [level=3] [ref=e261]: 3. Parallel Token Prediction (PTP)
              - generic [ref=e263]:
                - text: Auto-regressive (AR) decoding, where models generate one token at a time, remains a significant computational bottleneck for OCR-based VLMs.
