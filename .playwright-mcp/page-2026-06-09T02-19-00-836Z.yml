            - paragraph [ref=e894]:
              - text: "OmniDocBench-Table-block: To evaluate table recognition performance, we used the OmniDocBench-Table-block benchmark, with metrics including TEDS and Edit Distance. As shown in Table"
              - link "3" [ref=e895] [cursor=pointer]:
                - /url: "#S4.T3"
              - text: ", PaddleOCR-VL-L achieves the best overall performance among all compared methods. Specifically, it obtains the highest Overall TEDS of 0.9046 and the lowest Overall Edit Distance of 0.0681, indicating superior performance in capturing both table structure and content while reducing recognition errors. Although MinerU2.5 achieves the best Structural TEDS of 0.9539, PaddleOCR-VL-L remains more competitive in overall table recognition accuracy. These results demonstrate the effectiveness of PaddleOCR-VL-L for table recognition on OmniDocBench-Table-block."
          - generic [ref=e896]:
            - heading "4.2.2 Text Recognition" [level=4] [ref=e897]:
              - generic [ref=e898]: 4.2.2
              - text: Text Recognition
            - paragraph [ref=e900]: For text recognition, we utilize OmniDocBench-OCR-block to validate the effectiveness of models based on the edit distance metric.
            - paragraph [ref=e902]: "OmniDocBench-OCR-block: From the 1355 images of OmniDocBench v1.5, we extracted all text-related sub-images based on layout detection labels, removing any with null annotations. This process resulted in a total of 17,148 block-level images. This evaluation set is named OmniDocBench-OCR-block, with the ground truth still sourced from OmniDocBench. This evaluation set can more accurately assess the model’s text recognition performance without being affected by layout detection. We use the average normalized edit distance for evaluation."
            - paragraph [ref=e904]:
              - text: In Table
              - link "4" [ref=e905] [cursor=pointer]:
                - /url: "#S4.T4"
              - text: ", we present a comprehensive comparison of performance across various document types using different models. Our model, PaddleOCR-VL, consistently demonstrates superior performance, achieving the lowest error rates in almost all categories. Specifically, PaddleOCR-VL achieves the best results in the PPT2PDF (0.049), Academic Literature (0.021), Book (0.047), Colorful Textbook (0.082), Exam Paper (0.115), Magazine (0.020), Newspaper (0.035), Note (0.077), and Research Report (0.033) categories. These results highlight PaddleOCR-VL’s robust and versatile capability in handling diverse document types, establishing it as the leading method in the OmniDocBench-OCR-block performance evaluation."
          - generic [ref=e906]:
