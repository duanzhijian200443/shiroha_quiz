          - paragraph [ref=e184]: This design offers two advantages. First, it avoids processing large irrelevant backgrounds and therefore reduces the number of visual tokens passed to the vision-language model. Second, by separating region localization from content recognition, each module can specialize in its own subtask, leading to better efficiency and stronger recognition performance. The details of VRFM and PaddleOCR-VL-0.9B are introduced in Sections 3.1.1 and 3.1.2, respectively.
