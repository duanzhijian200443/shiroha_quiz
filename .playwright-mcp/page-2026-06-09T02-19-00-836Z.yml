              - text: •
              - paragraph [ref=e114]: We propose PaddleOCR-VL, a coarse-to-fine document parsing framework that allocates computation to semantically relevant regions while suppressing redundant ones. This paradigm effectively achieves both high-resolution accuracy and computational efficiency in multimodal document parsing.
