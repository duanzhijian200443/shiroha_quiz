        - paragraph [ref=e99]:
          - text: "While high-resolution inputs are essential for document parsing where fine-grained textual and structural details such as small and dense text, tables, and formulas significantly affect accuracy, they also lead to a quadratic increase in visual encoding and token processing costs. Notably, visual information in documents tends to be highly unevenly distributed: regions dense with semantic content coexist with large areas of redundant backgrounds or decorative elements. As illustrated in Figure"
          - link "2" [ref=e100] [cursor=pointer]:
            - /url: "#S1.F2"
          - text: ", based on our analysis on OmniDocBench v1.5, valid visual regions in PowerPoint documents account for only about 39% of the total area, whereas in information-dense documents such as newspapers, they occupy roughly 60%. Motivated by the sparsity of valid visual regions in documents, we introduce PaddleOCR-VL, a coarse-to-fine document parsing framework that can eliminate visual redundancy while improving performance and efficiency. Specifically, the coarse stage employs a lightweight Valid Region Focus Module (VRFM) to identify and locate the valid visual elements efficiently. The fine stage then uses a compact vision-language model, PaddleOCR-VL-0.9B, to perform detailed recognition within the extracted valid visual regions. This decoupled hierarchical design allows independent optimization of layout and recognition modules, enabling PaddleOCR-VL to achieve impressive accuracy with a small model size while maintaining high efficiency."
        - paragraph [ref=e102]: In addition, we developed a high-quality data pipeline, collecting over 30M widely distributed samples from public sources and synthesis, which has become one of the most critical factors enabling our method to achieve high performance.
        - paragraph [ref=e104]:
          - text: As illustrated in Figure
          - link "1" [ref=e105] [cursor=pointer]:
            - /url: "#S1.F1"
          - text: ", we conduct a comprehensive evaluation on the public benchmark OmniDocBench v1.5"
          - generic [ref=e106]:
            - text: "["
            - link "41" [ref=e107] [cursor=pointer]:
              - /url: "#bib.bib37"
            - text: "]"
          - text: ". Our results demonstrate that our proposed solution surpasses existing document parsing methods, achieving state-of-the-art performance across all four critical metrics: text, formula, table, and reading order scores. Furthermore, the right panel of Figure"
          - link "1" [ref=e108] [cursor=pointer]:
            - /url: "#S1.F1"
          - text: highlights that PaddleOCR-VL utilizes the fewest vision tokens and parameters, resulting in substantially lower latency and higher throughput compared to competing approaches.
