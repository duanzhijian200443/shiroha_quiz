                - text: training instances, substantially enhancing our model’s generalization capability and comprehensive performance in table recognition.
          - paragraph [ref=e1917]: Through the aforementioned data construction strategies, we build a comprehensive table dataset encompassing diverse table categories and recognition scenarios, thereby providing robust support for training our model in the table recognition task.
