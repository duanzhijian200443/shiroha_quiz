                    - /url: "#bib.bib54"
                  - text: "]"
                - text: . Specifically, UniMER-1M is oriented towards real document scenarios and has gathered 1 million formula data from arXiv, Pix2tex
                - generic [ref=e1952]:
                  - text: "["
                  - link "28" [ref=e1953] [cursor=pointer]:
                    - /url: "#bib.bib56"
                  - text: "]"
                - text: ", CROHME"
                - generic [ref=e1954]:
                  - text: "["
                  - link "37" [ref=e1955] [cursor=pointer]:
                    - /url: "#bib.bib57"
                  - text: ","
                  - link "38" [ref=e1956] [cursor=pointer]:
                    - /url: "#bib.bib58"
                  - text: ","
                  - link "31" [ref=e1957] [cursor=pointer]:
                    - /url: "#bib.bib59"
                  - text: "]"
                - text: ", and HME100K"
                - generic [ref=e1958]:
                  - text: "["
                  - link "57" [ref=e1959] [cursor=pointer]:
                    - /url: "#bib.bib60"
                  - text: "]"
                - text: . On the other hand, MathWriting is currently the largest handwritten mathematical formula dataset, comprising 230,000 real handwritten formula samples and 400,000 synthetic handwritten formula samples.
