            - listitem [ref=e1997]:
              - text: "3."
              - paragraph [ref=e1999]:
                - text: "Data Synthesis: To capture diverse visual styles and enhance model generalization, we designed a three-stage data synthesis pipeline. It begins with a large collection of base data tables, followed by an LLM Persona"
