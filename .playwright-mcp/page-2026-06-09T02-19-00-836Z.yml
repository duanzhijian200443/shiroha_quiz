          - paragraph [ref=e1922]:
            - text: As shown in Figure
            - link "S3" [ref=e1923] [cursor=pointer]:
              - /url: "#S1.F3"
            - text: ", this dataset was developed using a range of strategies, including source code rendering, automatic data annotation, targeted synthesis of long-tail data, and public data collection. It encompasses a variety of formula scenarios, such as educational supplementary materials, test papers for primary and secondary schools, mathematical papers, PowerPoint courseware, university theses, financial research reports, and handwritten mathematical notes. The dataset features four types of formulas: Simple Printed Expressions, Complex Printed Expressions, Screen-Captured Expressions, and Handwritten Expressions, available in both Chinese and English. The main process for constructing the dataset is as follows:"
          - 'figure "Figure S3: The construction method and characteristics of the formula training data for PaddleOCR-VL-0.9B." [ref=e1924]':
