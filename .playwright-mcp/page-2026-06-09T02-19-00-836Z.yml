        - paragraph [ref=e813]:
          - text: "To thoroughly assess the effectiveness of PaddleOCR-VL, we compared it against leading general vision language models and specialized document parsing models across multiple public benchmarks and in-house benchmarks. We conducted comprehensive performance comparisons in two aspects: page-level document parsing and element-level recognition, which are detailed in Sections"
          - link "4.1" [ref=e814] [cursor=pointer]:
            - /url: "#S4.SS1"
          - text: and
          - link "4.2" [ref=e815] [cursor=pointer]:
            - /url: "#S4.SS2"
          - text: . Page-level evaluation involves analyzing entire document pages to parse their overall content, structure, and layout, while element-level is dedicated exclusively to assessing the recognition of specific elements, such as text, tables, formulas, and charts, within the document.
        - generic [ref=e816]:
          - heading "4.1 Page-level Evaluation" [level=3] [ref=e817]:
            - generic [ref=e818]: "4.1"
            - text: Page-level Evaluation
          - paragraph [ref=e820]: This section details the evaluation of end-to-end document parsing capabilities using the following three benchmarks, aiming to measure its overall performance in real-world document scenarios.
          - paragraph [ref=e822]:
            - text: OmniDocBench v1.5 To comprehensively evaluate the document parsing capabilities, we conducted extensive experiments on the OmniDocBench v1.5
            - generic [ref=e823]:
              - text: "["
              - link "41" [ref=e824] [cursor=pointer]:
                - /url: "#bib.bib37"
              - text: "]"
            - text: benchmark. It is an expansion of version v1.0, adding 374 new documents for a total of 1,355 document pages. It features a more balanced distribution of data in both Chinese and English, as well as a richer inclusion of all elements. The evaluation method has been updated, with formulas assessed using the CDM method. The overall metric is a weighted combination of the metrics for text, formulas, and tables.
          - paragraph [ref=e826]:
            - text: Table
            - link "2" [ref=e827] [cursor=pointer]:
              - /url: "#S4.T2"
            - text: shows that the PaddleOCR-VL series models achieve SOTA performance across all key metrics, surpassing existing pipeline tools, general VLMs, and other specialized document parsing models, despite having significantly fewer visual tokens. Our series of models, S, M, and L, are configured to accommodate different input visual resolution ranges. Specifically, the S model is suitable for image resolutions within the range of [3136, 235200], the M model supports resolutions from [3136, 392000], and the L model is designed for resolutions ranging from [3136, 627200]. Specifically, PaddleOCR-VL-L achieves a top-ranking overall score of 92.62 with 2561 vision tokens, surpassing the next best model, MinerU2.5 (90.67) with 3256 vision tokens. Compared to the DeepSeek-OCR-Gundam-M model with a similar number of visual tokens, our method achieves overall metrics that are more than 6 points higher. Moreover, our model establishes new SOTA results in the sub-tasks, including the lowest Text-Edit distance
            - generic [ref=e828]:
              - text: "["
              - link "21" [ref=e829] [cursor=pointer]:
                - /url: "#bib.bib90"
              - text: "]"
            - text: of 0.035, the highest Formula-CDM score of 90.90, the leading scores of 90.48 and 94.19 in Table-TEDS and Table-TEDS-S, and the best reading order scores of 0.043, respectively. These results underscore its superior accuracy in text recognition, formula recognition, and complex table structure analysis.
        - generic [ref=e830]:
          - heading "4.2 Element-level Evaluation" [level=3] [ref=e831]:
            - generic [ref=e832]: "4.2"
            - text: Element-level Evaluation
          - paragraph [ref=e834]: Besides end-to-end document parsing performance, another advantage of our two-stage design is the ability to precisely focus on individual document elements. By isolating each element region via VRFM before feeding into the VLM, the model can dedicate its full capacity to recognizing each element type independently. To validate this advantage, we conduct element-level evaluations on text, tables, formulas, and charts using both public and in-house benchmarks.
