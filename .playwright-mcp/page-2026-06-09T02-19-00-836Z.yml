          - generic [ref=e1839]: I
          - text: Training Dataset Details
        - paragraph [ref=e1841]: This two-stage approach offers unique advantages in terms of data collection, as obtaining isolated element images along with their annotations is more feasible than collecting complete document pages containing different elements. In the following sections, we will elaborate on the construction of multimodal model training data for text, tables, formulas, and charts.
        - generic [ref=e1842]:
          - heading "I.1 Text" [level=3] [ref=e1843]:
            - generic [ref=e1844]: I.1
            - text: Text
          - paragraph [ref=e1846]:
            - text: We have curated a large-scale dataset comprising 20 Million High-Quality Image-Text Pairs. As shown in Figure
            - link "S1" [ref=e1847] [cursor=pointer]:
              - /url: "#S1.F1a"
            - text: ", the dataset generation follows a rigorous multi-stage pipeline which primarily involves:"
          - 'figure "Figure S1: The construction method and characteristics of the text training data for PaddleOCR-VL-0.9B." [ref=e1848]':
            - img "Refer to caption" [ref=e1849]
            - generic [ref=e1850]:
              - generic [ref=e1851]: "Figure S1:"
              - text: The construction method and characteristics of the text training data for PaddleOCR-VL-0.9B.
          - list [ref=e1853]:
            - listitem [ref=e1854]:
              - text: "1."
              - paragraph [ref=e1856]: "Automatic Data Annotation: We design an automatic annotation pipeline that integrates lightweight document-structure models with large multimodal language models. Specifically, PP-StructureV3 is employed as an expert model to perform layout analysis and text recognition, generating pseudo labels that are converted into prompts for multimodal models such as ERNIE-4.5-VL and Qwen2.5-VL to refine. Finally, the refined labels are aggregated and randomly merged at multiple granularities to produce 20 million high-quality image–text training samples."
            - listitem [ref=e1857]:
              - text: "2."
              - paragraph [ref=e1859]: "High-quality OCR Data Synthesis: During data distillation, low label quality in challenging scenarios like messy handwriting and dense blurry text was addressed by expanding the dataset through synthetic generation. Utilizing diverse CSS styles, over 200 fonts, and various corpora, we rendered a large amount of images, thereby enhancing the model’s capabilities in these difficult scenarios."
          - paragraph [ref=e1861]: "Ultimately, the data is meticulously annotated at three distinct hierarchical levels: text lines, text blocks, and text pages. With extensive language coverage of 109 languages, including major global ones like Chinese, English, French, and Hindi. It includes diverse scenes including Academic Papers, Newspapers, Handwritten texts, Ancient books, Id cards, tickets, seals, etc. Additionally, the dataset addresses compatibility with a variety of writing systems and text styles, covering Printing, Handwriting, Scanned text, Artistic Fonts, etc."
        - generic [ref=e1862]:
          - heading "I.2 Table" [level=3] [ref=e1863]:
