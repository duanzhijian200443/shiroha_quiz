          - list [ref=e1929]:
            - listitem [ref=e1930]:
              - text: "1."
              - paragraph [ref=e1932]: "Source Code Rendering: To enhance the model’s adaptability to a wide variety of unusual formula structures, a large amount of paper source code was scraped from arXiv, and LaTeX code for the formulas was extracted using regular expressions. Then, MinHash was used to remove duplicate and highly similar formula source codes, and KaTeX was employed to normalize the formula source codes, thereby reducing their ambiguity. Finally, the formulas were re-rendered into images using a formula rendering engine."
            - listitem [ref=e1933]:
              - text: "2."
              - paragraph [ref=e1935]:
                - text: "Automatic Data Annotation: For real-world formula data from exam papers, educational materials, and handwritten notes, the process begins with the use of the layout analysis method PP-StructureV3"
                - generic [ref=e1936]:
                  - text: "["
                  - link "9" [ref=e1937] [cursor=pointer]:
                    - /url: "#bib.bib52"
                  - text: "]"
                - text: to identify the bounding boxes for formulas. Based on these bounding boxes, formula regions are cropped from the images. Subsequently, large multimodal language models, such as ERNIE-4.5-VL-28B-A3B
                - generic [ref=e1938]:
                  - text: "["
                  - link "4" [ref=e1939] [cursor=pointer]:
                    - /url: "#bib.bib13"
                  - text: "]"
                - text: ", are employed to generate the LaTeX source code for these formulas. Given the rarity of Chinese formulas in real-world scenarios—where approximately 1 out of 100 formulas contains Chinese characters—PP-OCRv5"
                - generic [ref=e1940]:
                  - text: "["
                  - link "9" [ref=e1941] [cursor=pointer]:
                    - /url: "#bib.bib52"
                  - text: "]"
                - text: is utilized to recognize characters within the cropped regions, enabling targeted optimization when Chinese characters are detected. Due to the complex and diverse nature of real-world formulas, recognition errors may occur with existing large models. To address this, a LaTeX rendering engine is used to filter the formulas generated by these models. Specifically, image-formula pairs that cannot be successfully rendered by xelatex are discarded. For those that render successfully, a more in-depth screening is conducted by comparing metrics such as the aspect ratio between the recognized image and the rendered image.
            - listitem [ref=e1942]:
              - text: "3."
              - paragraph [ref=e1944]: "Targeted Synthesis of Long-tail Data: For certain long-tail formula structures, such as elementary school vertical calculations, formulas with strikethroughs, and handwritten formulas with explanatory arrows, existing multimodal large models struggle to accurately recognize them due to data distribution issues. To address this, LaTeX code is synthetically generated based on rules and inverse rendering is performed using a LaTeX rendering engine, thereby constructing image-formula matching pairs for these long-tail scenarios."
            - listitem [ref=e1945]:
              - text: "4."
              - paragraph [ref=e1947]:
                - text: "Public Data Collection: In order to enable the model to learn high-quality formula representations, a substantial amount of data has been collected from existing public datasets, including UniMER-1M"
                - generic [ref=e1948]:
                  - text: "["
                  - link "50" [ref=e1949] [cursor=pointer]:
