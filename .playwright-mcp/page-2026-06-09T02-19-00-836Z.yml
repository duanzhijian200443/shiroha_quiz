            - text: Table
          - paragraph [ref=e1866]:
            - text: As shown in Figure
            - link "S2" [ref=e1867] [cursor=pointer]:
              - /url: "#S1.F2a"
            - text: ", we constructed a large-scale dataset of over"
            - math [ref=e1868]:
              - generic [ref=e1870]: "5"
            - text: "million high-quality image-table pairs. Our dataset construction employs three key strategies: automatic data annotation, potential annotation mining, and high-quality data synthesis. For coding efficiency, we adopt OTSL"
