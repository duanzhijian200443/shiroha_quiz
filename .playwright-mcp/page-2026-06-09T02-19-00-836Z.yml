            - listitem [ref=e1992]:
              - text: "2."
              - paragraph [ref=e1994]:
                - text: "Automatic Data Annotation: To annotate our large collection of unlabeled public and in-house data, we developed a two-stage annotation pipeline based on the Vision Large Language Model ERNIE-4.5-VL"
                - generic [ref=e1995]:
