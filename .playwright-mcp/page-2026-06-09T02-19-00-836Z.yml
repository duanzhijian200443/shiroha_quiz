          - paragraph [ref=e2124]:
            - text: To further analyze the architectural design of VRFM, we conduct controlled comparisons with several representative baselines, including an end-to-end vision–language model (Qwen3-VL-8B), a token-reduction approach based on region cropping (DocKylin
