            - listitem [ref=e1892]:
              - text: "2."
              - paragraph [ref=e1894]: "Potential Annotation Mining:"
              - paragraph [ref=e1896]: For public data with potential annotations (e.g., from arXiv), we extract tables and their corresponding official-supported HTML source code. We then employ a mechanism combining regular expression matching with contextual and sequential alignment to construct accurate table-HTML pairs. The extracted HTML subsequently undergoes rule-based filtering, yielding high-quality data samples ready for model training.
            - listitem [ref=e1897]:
              - text: "3."
              - paragraph [ref=e1899]: "High-quality Table Synthesis:"
              - paragraph [ref=e1901]:
                - text: To overcome data imbalance and high annotation costs, we introduce an innovative high-quality table synthesis tool which constitutes the cornerstone of our table data collection pipeline. This tool enables both randomized synthesis for comprehensive data supplement and targeted synthesis to enhance recognition of specific table categories. Specifically, we first leverage LLMs to gather a diverse and extensive corpus.Then, our tool generates table training pairs through randomized configurations of structures, fonts, CSS styles, and textual content, while also supporting customized synthesis by specifying particular parameters to accurately simulate specialized table types. With a synthesis speed of
