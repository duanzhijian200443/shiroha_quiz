                - list [ref=e577]:
                  - listitem [ref=e578]:
                    - paragraph [ref=e579]: 2026/04/18 3.1.0 Released
                    - paragraph [ref=e580]:
                      - text: This release focuses on
                      - strong [ref=e581]: licensing openness, parsing accuracy, and full-format native support
                      - text: ". The main updates include:"
                    - list [ref=e582]:
                      - listitem [ref=e583]:
                        - text: License upgrade
                        - list [ref=e584]:
                          - listitem [ref=e585]:
                            - text: MinerU has officially moved from
                            - code [ref=e586]: AGPLv3
                            - text: to the
                            - link "MinerU Open Source License" [ref=e587] [cursor=pointer]:
                              - /url: https://github.com/opendatalab/MinerU/blob/master/LICENSE.md
                            - text: ", a custom license based on"
                            - code [ref=e588]: Apache 2.0
                            - text: .
                          - listitem [ref=e589]: This change significantly reduces adoption friction for both community users and commercial deployments, making MinerU easier to integrate into real-world workflows.
                      - listitem [ref=e590]:
                        - text: VLM main model upgrade
                        - list [ref=e591]:
                          - listitem [ref=e592]:
                            - text: The primary VLM model has been upgraded to
                            - code [ref=e593]: MinerU2.5-Pro-2604-1.2B
                            - text: ", bringing overall parsing accuracy to a state-of-the-art level."
                          - listitem [ref=e594]: The new model now supports image and chart parsing, truncated paragraph merging, cross-page table merging, and image recognition inside tables, further strengthening performance on complex document layouts.
                      - listitem [ref=e595]:
                        - text: Full-format native parsing support
                        - list [ref=e596]:
                          - listitem [ref=e597]:
                            - text: Native parsing support has now been extended to
                            - code [ref=e598]: PPTX
                            - text: and
                            - code [ref=e599]: XLSX
                            - text: .
                          - listitem [ref=e600]:
                            - text: MinerU now fully supports parsing across images,
                            - code [ref=e601]: PDF
                            - text: ","
                            - code [ref=e602]: DOCX
                            - text: ","
                            - code [ref=e603]: PPTX
                            - text: ", and"
                            - code [ref=e604]: XLSX
                            - text: ", providing a more complete multi-format document understanding workflow."
                    - paragraph [ref=e605]:
                      - text: With the 3.1.0 release, MinerU becomes more open, more accurate, and easier to adopt in production. The new license lowers the barrier for both community and commercial use,
                      - code [ref=e606]: MinerU2.5-Pro-2604-1.2B
                      - text: improves parsing quality on complex content, and native
                      - code [ref=e607]: PPTX
                      - text: /
                      - code [ref=e608]: XLSX
                      - text: support completes end-to-end coverage of mainstream document formats.
                  - listitem [ref=e609]:
                    - paragraph [ref=e610]: 2026/03/29 3.0.0 Released
                    - paragraph [ref=e611]:
                      - text: This release delivers a systematic upgrade centered on
                      - strong [ref=e612]: parsing capability, system architecture, and engineering usability
                      - text: ". The main updates include:"
                    - list [ref=e613]:
                      - listitem [ref=e614]:
                        - text: Native
                        - code [ref=e615]: DOCX
                        - text: parsing
                        - list [ref=e616]:
                          - listitem [ref=e617]:
                            - text: Official support for native
                            - code [ref=e618]: DOCX
                            - text: parsing, delivering high-precision results without hallucinations.
                          - listitem [ref=e619]:
                            - text: Compared with the traditional workflow of first converting
                            - code [ref=e620]: DOCX
                            - text: to
                            - code [ref=e621]: PDF
                            - text: and then parsing it, end-to-end speed is improved by tens of times, making it better suited for scenarios with high requirements for both accuracy and throughput.
                      - listitem [ref=e622]:
                        - code [ref=e623]: pipeline
                        - text: backend upgrade
                        - list [ref=e624]:
                          - listitem [ref=e625]:
                            - text: The
                            - code [ref=e626]: pipeline
                            - text: backend achieves a score of
                            - code [ref=e627]: "86.2"
                            - text: on OmniDocBench (v1.5), surpassing the accuracy of the previous-generation mainstream VLM
                            - code [ref=e628]: MinerU2.0-2505-0.9B
                            - text: .
                          - listitem [ref=e629]: Added support for parsing images/formulas inside tables, seal text recognition, vertical text support, and interline formula numbering recognition, continuously improving parsing quality for complex document scenarios.
                          - listitem [ref=e630]: While maintaining high accuracy, it keeps resource usage extremely low and continues to support inference in pure CPU environments.
                      - listitem [ref=e631]:
                        - code [ref=e632]: API / CLI / Router
                        - text: orchestration upgrade
                        - list [ref=e633]:
                          - listitem [ref=e634]:
                            - code [ref=e635]: mineru
                            - text: now runs as an orchestration client based on
                            - code [ref=e636]: mineru-api
                            - text: ; when
                            - code [ref=e637]: "--api-url"
                            - text: is not provided, it will automatically start a local temporary service.
                          - listitem [ref=e638]:
                            - code [ref=e639]: mineru-api
                            - text: adds a new asynchronous task endpoint
                            - code [ref=e640]: POST /tasks
                            - text: ", supporting task submission, status querying, and result retrieval; meanwhile, it retains the synchronous parsing endpoint"
                            - code [ref=e641]: POST /file_parse
                            - text: for compatibility with legacy plugins.
                          - listitem [ref=e642]:
                            - text: Added
                            - code [ref=e643]: mineru-router
                            - text: ", designed for unified entry deployment and task routing across multiple services and multiple GPUs; its interfaces are fully compatible with"
                            - code [ref=e644]: mineru-api
                            - text: and support automatic task load balancing.
                      - listitem [ref=e645]:
                        - text: Deployment and usability improvements
                        - list [ref=e646]:
                          - listitem [ref=e647]:
                            - text: Resolved compatibility issues with
                            - code [ref=e648]: torch >= 2.8
                            - text: ; the base image has been upgraded to
                            - code [ref=e649]: vllm0.11.2 + torch2.9.0
                            - text: ", unifying installation paths across different Compute Capabilities."
                          - listitem [ref=e650]: Optimized the parsing pipeline with a sliding-window mechanism, significantly reducing peak memory usage in long-document scenarios, so documents with tens of thousands of pages no longer need to be split manually.
                          - listitem [ref=e651]:
                            - text: Batch inference in
                            - code [ref=e652]: pipeline
                            - text: now supports streaming writes to disk, allowing completed parsing results to be written out in time and further improving the experience for long-running tasks.
                          - listitem [ref=e653]:
                            - text: Completed thread-safety optimization and now fully supports multi-threaded concurrent inference; together with
                            - code [ref=e654]: mineru-router
                            - text: ", this enables one-click multi-GPU deployment and makes it easy to build high-concurrency, high-throughput parsing systems."
                          - listitem [ref=e655]:
                            - text: Completely removed the use of two AGPLv3 models (
                            - code [ref=e656]: doclayoutyolo
                            - text: and
                            - code [ref=e657]: mfd_yolov8
                            - text: ) and one CC-BY-NC-SA 4.0 model (
                            - code [ref=e658]: layoutreader
                            - text: ).
                    - paragraph [ref=e659]:
                      - text: This update is not just a set of feature enhancements, but a key leap forward in MinerU's overall system capabilities. We specifically addressed the peak memory usage issue in long-document parsing. Through optimizations such as sliding windows and streaming writes to disk, ultra-long document parsing has moved from “requiring manual splitting and careful handling” to being “stable, scalable, and ready for production workloads.” At the same time, we completed thread-safety optimization and fully enabled multi-threaded concurrent inference, further improving single-machine resource utilization and runtime stability under high-concurrency workloads. On top of this, with
                      - code [ref=e660]: mineru-router
                      - text: and the new
                      - code [ref=e661]: API / CLI
                      - text: orchestration framework, MinerU now supports one-click multi-GPU deployment, unified access across multiple services, and automatic task load balancing, significantly reducing the difficulty of large-scale deployment. As a result, MinerU is evolving from a standalone data production tool into a large-scale document parsing foundation for high-concurrency and high-throughput scenarios, providing enterprise-grade document data processing with infrastructure that is more stable, more efficient, and easier to scale.
