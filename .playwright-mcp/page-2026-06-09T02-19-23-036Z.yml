                  - listitem [ref=e700]: Remove headers, footers, footnotes, page numbers, etc., to ensure semantic coherence.
                  - listitem [ref=e701]: Output text in human-readable order, suitable for single-column, multi-column, and complex layouts.
                  - listitem [ref=e702]: Preserve the structure of the original document, including headings, paragraphs, lists, etc.
                  - listitem [ref=e703]: Extract images, image descriptions, tables, table titles, and footnotes.
                  - listitem [ref=e704]: Automatically recognize and convert formulas in the document to LaTeX format.
                  - listitem [ref=e705]: Automatically recognize and convert tables in the document to HTML format.
                  - listitem [ref=e706]: Automatically detect scanned PDFs and garbled PDFs and enable OCR functionality.
                  - listitem [ref=e707]: OCR supports detection and recognition of 109 languages.
                  - listitem [ref=e708]: Supports multiple output formats, such as multimodal and NLP Markdown, JSON sorted by reading order, and rich intermediate formats.
                  - listitem [ref=e709]: Supports various visualization results, including layout visualization and span visualization, for efficient confirmation of output quality.
                  - listitem [ref=e710]: Built-in CLI, FastAPI, Gradio WebUI, for local orchestration and multi-service deployment.
                  - listitem [ref=e711]: Supports running in a pure CPU environment, and also supports GPU/MPS acceleration
                  - listitem [ref=e712]: Compatible with Windows, Linux, and Mac platforms.
