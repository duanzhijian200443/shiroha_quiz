            'test/data/external/external_credential_object_codec_test.dart',
            'test/data/external/windows_external_crypto_test.dart',
            'test/data/external/pairing_transcript_codec_test.dart',
            'test/data/external/exchange_message_codec_test.dart',
            'test/data/external/discovery_descriptor_codec_test.dart',
            'test/data/external/bootstrap_source_guard_test.dart',
            'test/data/external/exchange_file_source_guard_test.dart',
            'test/data/external/windows_exchange_file_store_test.dart',
            'test/data/external/windows_exchange_consumption_test.dart',
            'test/ui/generated_question/generated_external_origin_review_test.dart',
            'test/application/generated_question/generated_external_origin_test.dart',
            'test/application/generated_question/generated_external_origin_backup_test.dart',
            'test/ui/external_authorization_screen_test.dart',
            'test/services/retrieval/rag_lazy_artifact_provisioning_integration_test.dart',
            'test/application/generated_question/generated_external_origin_migration_test.dart',
            'test/application/agent/agent_config_service_test.dart',
            'test/application/agent/agent_history_test.dart',
            'test/data/repositories/agent_config_repository_test.dart'
          )

          $shardCount = 4
          $shardIndex = [int]'${{ matrix.shard }}' - 1
          $selected = @()
          for ($i = $shardIndex; $i -lt $tests.Count; $i += $shardCount) {
            $selected += $tests[$i]
          }

          Write-Output "Running shard $($shardIndex + 1)/$shardCount with $($selected.Count) test files"
          foreach ($test in $selected) {
            Write-Output "  $test"
          }

          $reportDirectory = '.dart_tool/ci-contract-timings'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $rawReport = "$reportDirectory/raw-${{ matrix.shard }}.jsonl"
          $summary = "$reportDirectory/shard-${{ matrix.shard }}.json"
          & flutter test --concurrency=1 --file-reporter "json:$rawReport" @selected
          $testExit = $LASTEXITCODE
          & ./tool/ci/summarize_flutter_test_times.ps1 -InputPath $rawReport -OutputPath $summary
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test timings (paths and durations only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contract-timings-${{ matrix.shard }}
          path: .dart_tool/ci-contract-timings/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: Changed Dart and focused contracts
    needs:
      - static
      - train_c_finalization_parity
      - contracts
      - windows_native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all verification jobs
        shell: pwsh
        run: |
          $staticResult = '${{ needs.static.result }}'
          $parityResult = '${{ needs.train_c_finalization_parity.result }}'
          $contractsResult = '${{ needs.contracts.result }}'
          $nativeResult = '${{ needs.windows_native.result }}'

          Write-Output "Static checks: $staticResult"
          Write-Output "TRAIN C finalization parity: $parityResult"
          Write-Output "Contract shards: $contractsResult"
          Write-Output "Windows native offline contracts: $nativeResult"

          if ($staticResult -ne 'success' -or
              $parityResult -ne 'success' -or
              $contractsResult -ne 'success' -or
              $nativeResult -ne 'success') {
            exit 1
          }
