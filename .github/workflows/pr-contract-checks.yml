name: PR contract checks

on:
  pull_request:
    branches:
      - master
      - integration/train-c-package-b-final
  push:
    branches:
      - master
      - integration/train-c-package-b-final
      - 'fix/train-c-*'
  schedule:
    # Monday 04:00 Asia/Shanghai (Sunday 20:00 UTC): weekly full regression.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A push checks the branch head while a pull_request checks the merge ref, and both
  # can carry the same branch name; sharing one group would let a branch push cancel
  # the required PR run. Manual and scheduled runs own a third namespace and never
  # cancel a required PR run.
  group: pr-contract-${{ github.event_name == 'push' && 'push' || github.event_name == 'schedule' && 'schedule' || 'review' }}-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  impact:
    name: Change impact analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      planDigest: ${{ steps.plan.outputs.planDigest }}
      static: ${{ steps.plan.outputs.unitStatic }}
      native: ${{ steps.plan.outputs.unitWindowsNative }}
      trainC: ${{ steps.plan.outputs.unitTrainCFinalizationParity }}
      contracts: ${{ steps.plan.outputs.unitContracts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check impact classification regressions
        run: python3 -B -m unittest discover -s tool/tests -p ci_impact_test.py

      - name: Check reuse and aggregate regressions
        run: |
          python3 -B -m unittest discover -s tool/tests -p ci_reuse_test.py
          python3 -B -m unittest discover -s tool/tests -p ci_gate_test.py

      - name: Check standing coverage, timing and aggregate gate
        shell: pwsh
        run: ./tool/tests/ci_contract_timings_test.ps1

      - name: Check inactive bootstrap source boundary
        shell: pwsh
        run: ./tool/external/check_bootstrap_source.ps1

      - name: Check Windows source isolation and mutation rejections
        shell: pwsh
        run: ./tool/external/check_l1_windows_source.ps1 -SelfTest

      - name: Check acceptance readiness and mutation rejections
        shell: pwsh
        run: ./tool/external/check_acceptance_readiness.ps1 -SelfTest

      - name: Resolve verification plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tool/ci/resolve_ci_impact.py --mode plan

      - name: Upload verification plan
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-impact-plan
          path: .dart_tool/ci-impact/plan.json
          retention-days: 7
          if-no-files-found: warn

  windows_native:
    name: Windows native offline contracts
    needs: impact
    if: needs.impact.outputs.native == 'execute'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile and inspect helper, run fake-only contracts
        shell: pwsh
        run: ./windows/external_native/check_offline.ps1
      - name: Compile local relay without loading the DLL
        shell: pwsh
        run: |
          cmake -S windows/local_relay -B build/ci-local-relay -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Local relay configure failed' }
          cmake --build build/ci-local-relay --config Debug --target shiroha_relay_native
          if ($LASTEXITCODE -ne 0) { throw 'Local relay build failed' }

  static:
    name: Static changed-Dart checks
    needs: impact
    if: needs.impact.outputs.static == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve base ref
        id: base-ref
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          if ($eventName -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
          } elseif ($eventName -eq 'push') {
            $before = '${{ github.event.before }}'
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $base = 'HEAD^'
            } else {
              $base = $before
            }
          } else {
            $base = 'HEAD^'
          }
          "base_ref=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolve packages
        run: flutter pub get

      - name: Check CI coverage and timing parser
        shell: pwsh
        run: ./tool/tests/ci_contract_timings_test.ps1

      - name: Check inactive bootstrap source boundary
        shell: pwsh
        run: ./tool/external/check_bootstrap_source.ps1

      - name: Verify changed Dart
        shell: pwsh
        env:
          BASE_REF: ${{ steps.base-ref.outputs.base_ref }}
        run: |
          ./tool/verify_changed.ps1 -BaseRef $env:BASE_REF

      - name: Check committed diff
        shell: pwsh
        env:
          BASE_REF: ${{ steps.base-ref.outputs.base_ref }}
        run: |
          & git diff --check "${env:BASE_REF}...HEAD"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  train_c_finalization_parity:
    name: TRAIN C finalization parity
    needs: impact
    if: needs.impact.outputs.trainC == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify finalization parity scope
        shell: pwsh
        run: |
          $formatTargets = @(
            'lib/services/import_pipeline/final_question_latex_audit.dart',
            'lib/services/import_pipeline/ocr_typed_candidate.dart',
            'test/services/import_pipeline/ocr_typed_candidate_finalization_parity_test.dart',
            'test/services/import_pipeline/latex_block_environment_normalizer_test.dart'
          )
          & dart format --output=none --set-exit-if-changed @formatTargets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $analyzeTargets = @(
            'lib/services/import_pipeline/final_question_latex_audit.dart',
            'lib/services/import_pipeline/ocr_typed_candidate.dart'
          )
          & flutter analyze @analyzeTargets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $testTargets = @(
            'test/services/import_pipeline/ocr_typed_candidate_finalization_parity_test.dart',
            'test/services/import_pipeline/latex_block_environment_normalizer_test.dart'
          )
          & flutter test --concurrency=1 @testTargets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  contracts:
    name: Contract shard ${{ matrix.shard }}/4
    needs: impact
    if: needs.impact.outputs.contracts == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check inactive bootstrap source boundary
        shell: pwsh
        run: ./tool/external/check_bootstrap_source.ps1

      - name: Verify independent public bootstrap vectors
        run: python3 tool/external/verify_bootstrap_vectors.py

      - name: Run contract shard
        shell: pwsh
        run: |
          $tests = @((Import-PowerShellDataFile ./tool/ci/contract_test_suites.psd1).Tests)

          $shardCount = 4
          $shardIndex = [int]'${{ matrix.shard }}' - 1
          $selected = @()
          for ($i = $shardIndex; $i -lt $tests.Count; $i += $shardCount) {
            $selected += $tests[$i]
          }

          Write-Output "Running shard $($shardIndex + 1)/$shardCount with $($selected.Count) test files"
          foreach ($test in $selected) {
            Write-Output "  $test"
          }

          $reportDirectory = '.dart_tool/ci-contract-timings'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $rawReport = "$reportDirectory/raw-${{ matrix.shard }}.jsonl"
          $summary = "$reportDirectory/shard-${{ matrix.shard }}.json"
          & flutter test --concurrency=1 --file-reporter "json:$rawReport" @selected
          $testExit = $LASTEXITCODE
          & ./tool/ci/summarize_flutter_test_times.ps1 -InputPath $rawReport -OutputPath $summary
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test timings (paths and durations only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contract-timings-${{ matrix.shard }}
          path: .dart_tool/ci-contract-timings/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: Changed Dart and focused contracts
    needs:
      - impact
      - static
      - train_c_finalization_parity
      - contracts
      - windows_native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verification plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan
          path: .dart_tool/ci-impact

      - name: Require planned units and fail closed
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_IMPACT: ${{ needs.impact.result }}
          RESULT_STATIC: ${{ needs.static.result }}
          RESULT_WINDOWS_NATIVE: ${{ needs.windows_native.result }}
          RESULT_TRAIN_C_FINALIZATION_PARITY: ${{ needs.train_c_finalization_parity.result }}
          RESULT_CONTRACTS: ${{ needs.contracts.result }}
        run: |
          python3 -B tool/ci/verify_ci_plan.py \
            --plan .dart_tool/ci-impact/plan.json \
            --output .dart_tool/ci-execution/report.json

      - name: Upload execution report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-execution-report
          path: .dart_tool/ci-execution/report.json
          retention-days: 7
          if-no-files-found: warn
