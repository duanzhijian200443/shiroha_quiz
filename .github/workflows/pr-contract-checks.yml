name: PR contract checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Changed Dart and focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify changed Dart and focused contracts
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          ./tool/verify_changed.ps1 `
            -BaseRef $env:BASE_REF `
            -TestPath @(
              'test/architecture_boundary_test.dart',
              'test/domain/question/question_region_test.dart',
              'test/services/import_pipeline/adapters/ocr_question_region_bridge_test.dart',
              'test/services/import_pipeline/adapters/text_question_region_bridge_test.dart',
              'test/services/import_pipeline/question_draft_v2_legacy_projection_test.dart',
              'test/services/import_pipeline/typed_question_assembler_test.dart',
              'test/r3d_question_assembly_shadow_acceptance_test.dart'
            )

      - name: Check committed PR diff
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          & git diff --check "${env:BASE_REF}...HEAD"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
