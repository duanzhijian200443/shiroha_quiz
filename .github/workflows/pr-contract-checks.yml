name: PR contract checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Changed Dart and focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve base ref
        id: base-ref
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          if ($eventName -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
          } elseif ($eventName -eq 'push') {
            $before = '${{ github.event.before }}'
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $base = 'HEAD^'
            } else {
              $base = $before
            }
          } else {
            $base = 'HEAD^'
          }
          "base_ref=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolve packages
        run: flutter pub get

      - name: Verify changed Dart and focused contracts
        shell: pwsh
        env:
          BASE_REF: ${{ steps.base-ref.outputs.base_ref }}
        run: |
          ./tool/verify_changed.ps1 `
            -BaseRef $env:BASE_REF `
            -TestPath @(
              'test/architecture_boundary_test.dart',
              'test/domain/question/question_region_test.dart',
              'test/services/import_pipeline/adapters/ocr_question_region_bridge_test.dart',
              'test/services/import_pipeline/adapters/text_question_region_bridge_test.dart',
              'test/services/import_pipeline/question_draft_v2_legacy_projection_test.dart',
              'test/services/import_pipeline/typed_question_assembler_test.dart',
              'test/r3d_question_assembly_shadow_acceptance_test.dart',
              'test/import_acceptance_test.dart',
              'test/ocr_smoke_contract_test.dart',
              'test/ocr_smoke_path_helpers_test.dart',
              'test/ocr_import_service_test.dart',
              'test/import_staging_unsupported_structure_banner_test.dart',
              'test/r5_rich_content_renderer_test.dart',
              'test/domain/content/rich_content_privacy_admission_test.dart',
              'test/domain/source/source_part_test.dart',
              'test/render_matrix_test.dart',
              'test/question_v2_persistence_mapper_test.dart',
              'test/database_v15_migration_test.dart',
              'test/question_repository_v2_test.dart',
              'test/r6_question_v2_persistence_acceptance_test.dart',
              'test/database_runtime_profile_test.dart',
              'test/import_commit_service_test.dart',
              'test/domain/question/question_draft_v2_codec_test.dart',
              'test/r7a_typed_review_snapshot_acceptance_test.dart',
              'test/r7b_ocr_typed_candidate_acceptance_test.dart',
              'test/r7c_review_result_writer_activation_acceptance_test.dart',
              'test/r7d_v2_first_question_list_acceptance_test.dart',
              'test/r7c1_attempt_aware_typed_commit_acceptance_test.dart'
            )

      - name: Check committed diff
        shell: pwsh
        env:
          BASE_REF: ${{ steps.base-ref.outputs.base_ref }}
        run: |
          & git diff --check "${env:BASE_REF}...HEAD"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
